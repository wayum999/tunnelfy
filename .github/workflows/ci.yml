name: CI

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # Keeps the quick-tunnel suite from opening real public Cloudflare tunnels.
      TUNNELFY_NETWORK_TESTS: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # Some suites check for the binary and spawn it with a mock token, which
      # cloudflared rejects as invalid; no tunnel is opened.
      - name: Install cloudflared
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/cloudflared" https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x "$HOME/.local/bin/cloudflared"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/cloudflared" --version

      - name: Test
        run: xvfb-run -a npm test

      # Packages from the package.json "files" allowlist alone and fails if
      # anything outside the runtime set reaches the VSIX. Nothing is published.
      - name: Package and check VSIX contents
        run: |
          npx --yes @vscode/vsce@4.0.0 package --no-dependencies --out tunnelfy-ci.vsix
          unzip -l tunnelfy-ci.vsix | tee vsix-contents.txt
          if grep -E '(\.claude/|\.orchestrator/|\.codex/|AGENTS\.md|extension/src/|\.map$|\.env)' vsix-contents.txt; then
            echo "::error::VSIX contains files outside the package.json files allowlist"
            exit 1
          fi
          echo "VSIX check passed: $(unzip -Z1 tunnelfy-ci.vsix | wc -l) entries, $(stat -c %s tunnelfy-ci.vsix) bytes"
