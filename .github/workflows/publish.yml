name: Publish

# Publishes one VSIX to the VS Marketplace and Open VSX when a GitHub release
# is published. The tokens live only as repository secrets (VSCE_PAT, OVSX_PAT)
# and reach the tools through env; they are never echoed or passed as arguments.
# This workflow never runs on push or pull_request.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)publish, e.g. 0.2.1"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # Untrusted input: only ever read through this variable, never interpolated into a script.
      TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check tag format and secrets
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag is not X.Y.Z (digits and dots only)"
            exit 1
          fi
          missing=0
          if [[ -z "${VSCE_PAT:-}" ]]; then
            echo "::error::Repository secret VSCE_PAT is not set (gh secret set VSCE_PAT)"
            missing=1
          fi
          if [[ -z "${OVSX_PAT:-}" ]]; then
            echo "::error::Repository secret OVSX_PAT is not set (gh secret set OVSX_PAT)"
            missing=1
          fi
          exit "$missing"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check tag matches package.json and is on main
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          if [[ "$version" != "$TAG" ]]; then
            echo "::error::Tag $TAG does not match package.json version $version"
            exit 1
          fi
          tag_commit="$(git rev-parse "refs/tags/$TAG^{commit}")"
          if [[ "$(git rev-parse HEAD)" != "$tag_commit" ]]; then
            echo "::error::Checked-out commit is not the commit tag $TAG points to"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "::error::Tag $TAG ($tag_commit) is not reachable from origin/main"
            exit 1
          fi
          echo "Tag $TAG -> $tag_commit, version $version, reachable from origin/main"

      - name: Check the GitHub release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName >/dev/null; then
            echo "::error::No GitHub release for tag $TAG"
            exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install, compile and lint
        run: |
          set -euo pipefail
          npm ci
          npm run compile
          npm run lint

      - name: Package VSIX
        run: |
          set -euo pipefail
          vsix="tunnelfy-$TAG.vsix"
          npx --yes @vscode/vsce@4.0.0 package --no-dependencies -o "$vsix"
          echo "VSIX=$vsix" >> "$GITHUB_ENV"

      # The same denylist CI runs, plus an exact match against the package.json
      # "files" allowlist as vsce lays it out.
      - name: Check VSIX contents
        run: |
          set -euo pipefail
          unzip -l "$VSIX" | tee vsix-contents.txt
          if grep -E '(\.claude/|\.orchestrator/|\.codex/|AGENTS\.md|extension/src/|\.map$|\.env)' vsix-contents.txt; then
            echo "::error::VSIX contains files outside the package.json files allowlist"
            exit 1
          fi
          expected="$(printf '%s\n' \
            '[Content_Types].xml' \
            'extension.vsixmanifest' \
            'extension/LICENSE.txt' \
            'extension/changelog.md' \
            'extension/dist/extension.js' \
            'extension/images/icon.png' \
            'extension/package.json' \
            'extension/readme.md' | LC_ALL=C sort)"
          actual="$(unzip -Z1 "$VSIX" | LC_ALL=C sort)"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::VSIX entries differ from the expected allowlisted set"
            diff <(echo "$expected") <(echo "$actual") || true
            exit 1
          fi
          echo "VSIX check passed: $(unzip -Z1 "$VSIX" | wc -l) entries, $(stat -c %s "$VSIX") bytes"

      - name: Publish to the VS Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          set -euo pipefail
          npx --yes @vscode/vsce@4.0.0 publish --packagePath "$VSIX" --skip-duplicate
          echo "VS Marketplace: $TAG published, or already present (--skip-duplicate)"

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          set -euo pipefail
          npx --yes ovsx@1.2.0 publish "$VSIX" --skip-duplicate
          echo "Open VSX: $TAG published, or already present (--skip-duplicate)"

      - name: Attach VSIX to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$VSIX" --clobber --repo "$GITHUB_REPOSITORY"
